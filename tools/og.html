<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OG Neo Clínica</title>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#FBF6F2}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;font-family:var(--sans);color:var(--ink)}
  .og__orb{position:absolute;border-radius:50%}
  .og__orb--a{width:640px;height:640px;background:#F5E8F0;right:-160px;top:-220px}
  .og__orb--b{width:210px;height:210px;background:#C997B8;right:250px;bottom:-70px;opacity:.5}
  .og__orb--c{width:120px;height:120px;background:#64446E;right:150px;bottom:110px;opacity:.9}
  .og__in{position:relative;padding:70px 88px;height:100%;box-sizing:border-box;display:flex;flex-direction:column}
  .og__brand{--logo:96px}
  .og__title{font-family:var(--serif);font-size:60px;font-weight:450;line-height:1.02;letter-spacing:-.02em;margin:auto 0 0;max-width:730px;color:#2E1F33}
  .og__title em{font-style:italic;font-weight:400;color:#8E5A7C}
  .og__sub{font-size:22px;color:#584860;margin:20px 0 0;max-width:730px;line-height:1.4}
  .og__chips{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap;max-width:770px}
  .og__chips span{font-size:16px;font-weight:600;color:#64446E;background:#fff;border:1.5px solid #D8C6D3;border-radius:999px;padding:9px 16px}
  .og__foot{position:absolute;right:88px;bottom:70px;font-size:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#7A6A80}
</style>
</head>
<body>
<div class="og">
  <div class="og__orb og__orb--a"></div>
  <div class="og__orb og__orb--b"></div>
  <div class="og__orb og__orb--c"></div>
  <div class="og__in">
    <div class="brand og__brand">
      <svg class="brand__symbol" viewBox="3.5 4 208 175.5" fill="none" aria-hidden="true">
        <g class="sym" stroke-linecap="round">
          <circle cx="71.5" cy="27.5" r="15.5" stroke-width="16"/>
          <circle cx="150" cy="27.5" r="15.5" stroke-width="16"/>
          <path d="M12.5 170.5V107a42.25 42.25 0 0 1 84.5 0v63.5" stroke-width="18"/>
          <path d="M200 100.5a52.5 52.5 0 1 0 0 32" stroke-width="18"/>
        </g>
        <g class="sym-alvo"><circle cx="150" cy="116.5" r="18.25" stroke-width="14.5"/></g>
      </svg>
      <span class="brand__text">
        <span class="brand__neo">Neo</span>
        <span class="brand__clinica">Clínica</span>
        <span class="brand__tag">Amor &amp; Saúde</span>
      </span>
    </div>
    <h1 class="og__title">Cuidado médico para cada fase da vida, <em>perto de casa.</em></h1>
    <p class="og__sub">Centro de saúde e especialidades em Marília e Garça. Agendamento pelo WhatsApp.</p>
    <div class="og__chips"><span>Ginecologia e Obstetrícia</span><span>Pediatria e Neonatologia</span><span>Clínica Médica e Geriatria</span><span>Saúde Mental</span></div>
    <div class="og__foot">Marília · Garça</div>
  </div>
</div>
</body>
</html>
