<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OG Neo Clínica</title>
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#FBF6F1}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;font-family:var(--sans);color:var(--ink)}
  .og__orb{position:absolute;border-radius:50%}
  .og__orb--a{width:640px;height:640px;background:#F5E6EE;right:-160px;top:-220px}
  .og__orb--b{width:210px;height:210px;background:#B5789D;right:250px;bottom:-70px;opacity:.55}
  .og__orb--c{width:120px;height:120px;background:#3B2140;right:150px;bottom:110px;opacity:.9}
  .og__in{position:relative;padding:76px 88px;height:100%;box-sizing:border-box;display:flex;flex-direction:column}
  .og__brand{display:flex;align-items:center;gap:20px}
  .og__brand svg{width:76px;height:76px}
  .og__name{font-family:var(--serif);font-size:52px;font-weight:500;letter-spacing:-.01em;color:#3B2140;line-height:1}
  .og__tag{font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#8E4F79;margin-top:10px}
  .og__title{font-family:var(--serif);font-size:64px;font-weight:450;line-height:1.02;letter-spacing:-.02em;margin:auto 0 0;max-width:720px}
  .og__title em{font-style:italic;font-weight:400;color:#8E4F79}
  .og__sub{font-size:22px;color:#584860;margin:22px 0 0;max-width:720px;line-height:1.4}
  .og__chips{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap;max-width:760px}
  .og__chips span{font-size:16px;font-weight:600;color:#3B2140;background:#fff;border:1.5px solid #D7C4CE;border-radius:999px;padding:9px 16px}
  .og__foot{position:absolute;right:88px;bottom:70px;font-size:16px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#7B6B80}
</style>
</head>
<body>
<div class="og">
  <div class="og__orb og__orb--a"></div>
  <div class="og__orb og__orb--b"></div>
  <div class="og__orb og__orb--c"></div>
  <div class="og__in">
    <div class="og__brand">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="15" cy="20" r="11" fill="#B5789D"/><circle cx="25" cy="20" r="11" fill="#3B2140" fill-opacity=".92"/><path d="M20 11.5a11 11 0 0 1 0 17 11 11 0 0 1 0-17Z" fill="#EAD3E0"/></svg>
      <div><div class="og__name">Neo Clínica</div><div class="og__tag">Amor &amp; Saúde</div></div>
    </div>
    <h1 class="og__title">Cuidado médico para cada fase da vida, <em>perto de casa.</em></h1>
    <p class="og__sub">Centro de saúde e especialidades em Marília e Garça. Agendamento pelo WhatsApp.</p>
    <div class="og__chips"><span>Ginecologia e Obstetrícia</span><span>Pediatria e Neonatologia</span><span>Clínica Médica e Geriatria</span><span>Saúde Mental</span></div>
    <div class="og__foot">Marília · Garça</div>
  </div>
</div>
</body>
</html>
